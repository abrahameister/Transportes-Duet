name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-portal

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: ./web-portal/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run Typecheck
      run: npm run typecheck

    - name: Run Unit Tests
      run: npm run test

    - name: Build Project
      run: npm run build

  # E2E Testing (Manual Trigger or if Secrets are provided)
  # This can be triggered manually via workflow_dispatch
  # or un-commented if Chromium is needed in CI
  # e2e:
  #   runs-on: ubuntu-latest
  #   ...
